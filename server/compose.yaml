# LibreSpeed backend for Comet, intended to sit behind Nginx Proxy Manager.
#
#   docker compose up -d --build
#
# NPM and this container must share a Docker network. Set NPM_NETWORK in .env to the
# network NPM is attached to (find it with `docker inspect <npm-container>`), then in NPM
# add a Proxy Host: forward host `comet-speedtest`, port 8080, scheme http.
services:
  comet-speedtest:
    build: .
    container_name: comet-speedtest
    restart: unless-stopped
    networks:
      - proxy
    # Uncomment to test directly without NPM:
    # ports:
    #   - "127.0.0.1:8080:8080"

networks:
  proxy:
    name: ${NPM_NETWORK:-npm_default}
    external: true
